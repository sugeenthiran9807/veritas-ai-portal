<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Examination Mark List - Veritas AI</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #eef5ff;
            text-align: center;
            padding: 30px 16px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            background-color: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px #999999;
        }
        h1 {
            color: #2c3e50;
            font-size: clamp(20px, 5vw, 24px);
            margin-bottom: 8px;
        }
        h2 {
            color: #1565c0;
            font-size: clamp(15px, 4vw, 18px);
            margin-bottom: 25px;
        }
        input[type=text], input[type=number] {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #999999;
            border-radius: 6px;
            font-size: 16px; /* Prevents iOS Safari auto-zoom */
            box-sizing: border-box;
        }
        input[type=submit], button {
            background-color: #2c3e50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        input[type=submit]:hover, button:hover {
            background-color: #1a252f;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #1565c0;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        /* Results Table */
        #resultContainer {
            display: none;
            margin-top: 25px;
            text-align: left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
            width: 45%;
        }
        td {
            padding: 12px;
            border: 1px solid #999999;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI CONTENT VERIFICATION SYSTEM</h1>
        <h2>STUDENT EXAMINATION MARK LIST</h2>
        <form id="markForm" onsubmit="handleSearch(event)">
            <label for="regno" style="font-weight: bold; color: #333;">Enter Register Number:</label><br>
            <input type="number" id="regno" name="regno" placeholder="e.g. 9807, 9947, 9948, 9949" required>
            <br>
            <input type="submit" value="Display Mark List">
        </form>

        <div id="resultContainer">
            <table>
                <tr>
                    <th>Student Name</th>
                    <td id="resName"></td>
                </tr>
                <tr>
                    <th>Register Number</th>
                    <td id="resRegNo"></td>
                </tr>
                <tr>
                    <th>Examination</th>
                    <td id="resExam"></td>
                </tr>
                <tr>
                    <th>Marks</th>
                    <td id="resMarks"></td>
                </tr>
                <tr>
                    <th>Result</th>
                    <td id="resResult"></td>
                </tr>
            </table>
            <div style="text-align: center; margin-top: 15px;">
                <button type="button" onclick="document.getElementById('resultContainer').style.display='none'">Back</button>
            </div>
        </div>

        <br>
        <a href="index.html" class="nav-link">← Return to Veritas Main Portal</a>
    </div>

    <script>
        const students = {
            9807: { name: "SUGEENTHIRAN", exam: "AI Content Verification Examination", marks: "5 / 5", result: "PASS" },
            9947: { name: "M. MOHAMED ZAID", exam: "AI Content Verification Examination", marks: "5 / 5", result: "PASS" },
            9948: { name: "ROOH", exam: "AI Content Verification Examination", marks: "5 / 5", result: "PASS" },
            9949: { name: "NOOR", exam: "AI Content Verification Examination", marks: "4 / 5", result: "PASS" },
            9950: { name: "AIRA", exam: "AI Content Verification Examination", marks: "3 / 5", result: "PASS" },
            9951: { name: "MEER", exam: "AI Content Verification Examination", marks: "5 / 5", result: "PASS" },
            9952: { name: "AYAN", exam: "AI Content Verification Examination", marks: "2 / 5", result: "FAIL" },
            9087654321: { name: "Riya Sharma", exam: "AI Content Verification Examination", marks: "5 / 5", result: "PASS" }
        };

        function handleSearch(e) {
            e.preventDefault();
            const regno = document.getElementById('regno').value.trim();
            const record = students[regno];
            const resContainer = document.getElementById('resultContainer');

            if (record) {
                document.getElementById('resName').textContent = record.name;
                document.getElementById('resRegNo').textContent = regno;
                document.getElementById('resExam').textContent = record.exam;
                document.getElementById('resMarks').textContent = record.marks;
                const resEl = document.getElementById('resResult');
                resEl.textContent = record.result;
                resEl.style.color = record.result === 'PASS' ? '#059669' : '#dc2626';
                resEl.style.fontWeight = 'bold';
                resContainer.style.display = 'block';
            } else {
                alert("Student examination details not found for Register Number: " + regno);
                resContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
